# workers_dev MUST stay true now that a custom domain exists.
#
# Defining [[routes]] makes wrangler DISABLE the workers.dev subdomain unless this is set, and that
# is not a cosmetic loss: it is the address every already-shipped build still talks to. Deploying the
# custom domain without it took both old hostnames from serving to 404 in one step.
#
# It lives HERE, above the first table header, because TOML scopes a bare key to the table it follows
# — put after [observability] it silently became observability.workers_dev and did nothing at all,
# which cost a whole deploy cycle to notice.
workers_dev = true

# Iron Rain relay on Cloudflare — one Durable Object per server_id bridges a daemon (host) and an
# app (client). Runs at the edge nearest whoever connects, and WebSocket Hibernation makes the
# always-open idle host connection cost ~nothing. Deploy:  cd relay-cf && npx wrangler deploy
name = "oculus-relay"
main = "src/index.ts"
compatibility_date = "2026-04-07" # enables web_socket_auto_reply_to_close + current DO semantics

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

# SQLite-backed DO class (required for the free plan; the bridge itself keeps no storage).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]

[observability]
enabled = true


# Custom domain. This is not cosmetic: the workers.dev name is a PERSONAL account's subdomain, so an
# account change would strand every daemon whose baked-in relay URL points at it, with no way to
# reach them. relay.ironrain.app is the address that survives that.
#
# custom_domain = true makes wrangler create the DNS record and the certificate on deploy. It works
# because ironrain.app is a zone in this same Cloudflare account; it is exactly what a Worker cannot
# do for a zone hosted elsewhere, which is why this waited on owning the domain.
#
# DO NOT also list the workers.dev name in the daemon's relay list as a "fallback". Both names route
# to THIS worker, and the DO is chosen by idFromName(sid) alone — so a daemon registering on both
# opens two host claims for one server_id against one Durable Object, and a proven host evicts
# another host on the same sid. The daemon would evict itself, repeatedly. Two relay URLs are only
# ever safe when they are two separate DEPLOYMENTS.
[[routes]]
pattern = "relay.ironrain.app"
custom_domain = true
