name: TestFlight beta

# Manual trigger — builds the iOS app and uploads to TestFlight via fastlane.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (App Store Connect API key)
#      AND IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD (the Apple Distribution identity).
#
# BOTH halves are required and they do different jobs. The API key authenticates you to
# Apple; it is NOT a signing identity. Without the .p12 there is no distribution private
# key on the runner, so fastlane tries to mint a third distribution certificate, hits
# Apple's cap of two, and the build dies before it compiles anything — which is exactly
# why every run of this workflow failed until the cert import below was added.
#
# The private key of a distribution certificate exists only where it was created; Apple
# will never re-issue it. So it has to be carried in as a secret, the same way the macOS
# release job has always carried its Developer ID cert (release.yml).
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What's new in this build"
        required: false
        default: "New Oculus beta build."

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Xcode 26 is the default on macos-26, and it is what the app must be built with: Liquid Glass
        # is opt-in BY SDK, so a build linked against the 18/15 SDK renders in compatibility appearance
        # on OS 26 no matter what the device is running. Pinning 16.4 was silently shipping every
        # release without the new design. Pinned explicitly rather than left implicit so a future
        # default bump is a deliberate change, not a surprise.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || true

      - name: Install tools
        run: brew install xcodegen fastlane

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf 'ASC_KEY_ID=%s\nASC_ISSUER_ID=%s\n' "$ASC_KEY_ID" "${{ secrets.ASC_ISSUER_ID }}" > fastlane/.env

      - name: Import the Apple Distribution certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::IOS_CERT_P12_BASE64 is not set. Without the distribution identity's"
            echo "::error::private key this job cannot sign — fastlane would try to create a third"
            echo "::error::distribution certificate and fail on Apple's two-certificate cap."
            echo "::error::See docs/distribution.md → 'TestFlight from CI' for how to export it."
            exit 1
          fi
          # A throwaway keychain, unlocked only for this job — same shape as the macOS release
          # job's Developer ID import (release.yml), which has been signing and notarizing this
          # way for months.
          KC="$RUNNER_TEMP/ios-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive prompt no one can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # Keep login.keychain in the search list: fastlane's own lookups expect it to be there.
          security list-keychain -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/ios-cert.p12"
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Imported distribution identity:"
          security find-identity -v -p codesigning "$KC" | sed 's/^/  /'

      - name: fastlane beta
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: fastlane ios beta
