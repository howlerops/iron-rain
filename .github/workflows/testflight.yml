name: TestFlight beta

# Manual trigger — builds the iOS app and uploads to TestFlight via fastlane.
# Requires repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64.
on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "What's new in this build"
        required: false
        default: "New Oculus beta build."

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Xcode 26 is the default on macos-26, and it is what the app must be built with: Liquid Glass
        # is opt-in BY SDK, so a build linked against the 18/15 SDK renders in compatibility appearance
        # on OS 26 no matter what the device is running. Pinning 16.4 was silently shipping every
        # release without the new design. Pinned explicitly rather than left implicit so a future
        # default bump is a deliberate change, not a surprise.
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || true

      - name: Install tools
        run: brew install xcodegen fastlane

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf 'ASC_KEY_ID=%s\nASC_ISSUER_ID=%s\n' "$ASC_KEY_ID" "${{ secrets.ASC_ISSUER_ID }}" > fastlane/.env

      - name: fastlane beta
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: fastlane ios beta
