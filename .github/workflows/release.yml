name: Release oculusd

# Cross-compiles the daemon and publishes prebuilt binaries to a GitHub Release, so the
# curl installer needs no Go/git. Trigger by pushing a tag (v*) or via manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create + release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Build binaries
        working-directory: daemon
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p ../dist
          # Stamp the real version so the daemon knows it (self-update comparison + version reporting).
          # Without -X main.version, every released daemon reported 0.0.0-dev and could never tell it
          # was stale — the root cause of the daemon silently drifting behind the app.
          VERSION="${TAG#v}"
          for pair in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            echo "building $os/$arch @ $VERSION"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o oculusd .
            tar -czf "../dist/oculusd_${os}_${arch}.tar.gz" oculusd
            rm oculusd
          done
          ( cd ../dist && shasum -a 256 *.tar.gz > checksums.txt )
          ls -lh ../dist

      - name: Create tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ inputs.tag }}" || true
          git push origin "${{ inputs.tag }}" || true

      # Create the release as a DRAFT with the daemon binaries. It stays a draft (so it is NOT
      # "latest" and the curl installer / in-app update check can't see it yet) until the macos-app
      # job attaches IronRain-macos.zip and publishes it. This closes the window where the release
      # was already "latest" but the macOS app zip wasn't attached — the "app download unavailable"
      # / failed-update race.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: true

  macos-app:
    # Attaches the macOS app zip to the drafted release, then PUBLISHES it (draft: false) — so the
    # release only becomes "latest" once every asset (daemon + macOS) is present.
    needs: release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      # Pin the toolchain explicitly. Liquid Glass is opt-in BY SDK, so which Xcode builds this
      # decides whether the shipped app gets the new design at all — that is not something to leave
      # to whatever the runner image happens to default to.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || true
      # Import a Developer ID certificate when one is configured.
      #
      # Ad-hoc signing is why the app asks for the login keychain on EVERY launch. A macOS keychain
      # item's ACL is bound to a stable code identity; an ad-hoc signature has none (TeamIdentifier
      # is literally "not set"), so each build looks like a different application to the keychain and
      # the user is asked to authorise it again. Nothing in app code can fix that — the identity is
      # the fix. It also gets Gatekeeper off the user's back on first open.
      #
      # Optional on purpose: without the secrets this is skipped and the build stays ad-hoc exactly
      # as before, so the release pipeline never breaks on a missing certificate.
      - name: Import Developer ID certificate (skipped when not configured)
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "no MACOS_CERT_P12_BASE64 — building ad-hoc (users will be re-prompted for keychain access)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A throwaway keychain, unlocked only for this job.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive prompt that no one can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Iron Rain.app
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          VERSION="${TAG#v}"   # stamp the release version so the app knows it (update check)
          xcodegen generate --spec app/project.yml
          if [ "$SIGNED" = "true" ]; then
            xcodebuild -project app/Oculus.xcodeproj -scheme Oculus-macOS -configuration Release \
              -derivedDataPath build/mac -destination 'platform=macOS' build \
              MARKETING_VERSION="$VERSION" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"
          else
            xcodebuild -project app/Oculus.xcodeproj -scheme Oculus-macOS -configuration Release \
              -derivedDataPath build/mac -destination 'platform=macOS' build \
              MARKETING_VERSION="$VERSION" \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          fi
          cd build/mac/Build/Products/Release
          cp -R "Oculus-macOS.app" "Iron Rain.app"
          # Record what actually happened, so "why is it prompting again" is answerable from the log.
          codesign -dv "Iron Rain.app" 2>&1 | grep -E "Signature|TeamIdentifier" || true
          ditto -c -k --keepParent "Iron Rain.app" "$GITHUB_WORKSPACE/IronRain-macos.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: IronRain-macos.zip
          draft: false        # publish now that ALL assets (daemon + macOS zip) are attached
          make_latest: "true"
