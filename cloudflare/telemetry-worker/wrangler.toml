# Oculus / Iron Rain anonymized telemetry ingest Worker.
#
# Deploy (needs your Cloudflare auth — run once):
#   cd cloudflare/telemetry-worker
#   npx wrangler login          # if not already authed
#   npx wrangler deploy
#
# After deploy the ingest URL is https://oculus-telemetry.<your-subdomain>.workers.dev/ingest —
# it must match telemetry.DefaultEndpoint in daemon/telemetry/telemetry.go.
name = "oculus-telemetry"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Analytics Engine: cheap, high-cardinality, queryable via the SQL API. No dataset pre-creation
# needed — the first writeDataPoint creates it.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "oculus_telemetry"

# workers_dev MUST stay true now that a custom domain exists.
#
# Defining [[routes]] makes wrangler DISABLE the workers.dev subdomain unless this is set, and that
# is not a cosmetic loss: it is the address every already-shipped build still talks to. Deploying the
# custom domain without this took both old hostnames from serving to 404 in one step — caught only
# because the endpoints were probed by hand afterwards.
workers_dev = true

# Custom domain — same reasoning as the relay: the workers.dev name belongs to a personal account.
#
# The telemetry endpoint has a sharper edge than the relay, and it is worth stating where someone
# will read it before changing DefaultEndpoint. telemetry.DefaultEndpoint is a SINGLE url with no
# fallback list, so a build that shipped with the old address posts there forever. Keep the
# workers.dev route serving after the cutover: telemetry going quiet produces no error anywhere, on
# either side, so the failure is invisible until someone notices a graph stopped.
[[routes]]
pattern = "telemetry.ironrain.app"
custom_domain = true
