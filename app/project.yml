# xcodegen spec for the universal Oculus app (iOS + macOS).
# Generate: cd app && xcodegen generate   →   Oculus.xcodeproj
# Build (simulator, no signing): xcodebuild -project Oculus.xcodeproj -scheme Oculus-iOS \
#   -destination 'generic/platform=iOS Simulator' build
name: Oculus
options:
  bundleIdPrefix: com.howlerops
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  OculusKit:
    path: OculusKit

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Oculus-iOS:
    type: application
    platform: iOS
    sources:
      - Oculus/Sources
      - Oculus/Assets.xcassets
    info:
      path: Oculus/Info-iOS.plist
      properties:
        CFBundleDisplayName: Oculus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSUserActivityTypes:
          - com.howlerops.oculus.session
    dependencies:
      - package: OculusKit
        product: OculusUI
      - target: OculusWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus
        TARGETED_DEVICE_FAMILY: "1,2"

  OculusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - OculusWidgets
    dependencies:
      - package: OculusKit
        product: OculusUI
    info:
      path: OculusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Oculus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus.OculusWidgets

  Oculus-macOS:
    type: application
    platform: macOS
    sources:
      - Oculus/Sources
      - Oculus/Assets.xcassets
    info:
      path: Oculus/Info-macOS.plist
      properties:
        CFBundleDisplayName: Oculus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSUserActivityTypes:
          - com.howlerops.oculus.session
    dependencies:
      - package: OculusKit
        product: OculusUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus
