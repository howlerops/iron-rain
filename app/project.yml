# xcodegen spec for the universal Oculus app (iOS + macOS).
# Generate: cd app && xcodegen generate   →   Oculus.xcodeproj
# Build (simulator, no signing): xcodebuild -project Oculus.xcodeproj -scheme Oculus-iOS \
#   -destination 'generic/platform=iOS Simulator' build
name: Oculus
options:
  bundleIdPrefix: com.howlerops
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  OculusKit:
    path: OculusKit

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    INFOPLIST_KEY_CFBundleDisplayName: Oculus

targets:
  Oculus-iOS:
    type: application
    platform: iOS
    sources:
      - Oculus/Sources
    dependencies:
      - package: OculusKit
        product: OculusUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  Oculus-macOS:
    type: application
    platform: macOS
    sources:
      - Oculus/Sources
    dependencies:
      - package: OculusKit
        product: OculusUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus
