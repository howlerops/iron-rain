# xcodegen spec for the universal Oculus app (iOS + macOS).
# Generate: cd app && xcodegen generate   →   Oculus.xcodeproj
# Build (simulator, no signing): xcodebuild -project Oculus.xcodeproj -scheme Oculus-iOS \
#   -destination 'generic/platform=iOS Simulator' build
name: Oculus
options:
  bundleIdPrefix: com.howlerops
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  OculusKit:
    path: OculusKit

settings:
  base:
    MARKETING_VERSION: "0.2.111"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Signing: automatic with Jacob Beck's Apple Development team. Xcode auto-registers
    # the App IDs + Push capability on first device build. Override DEVELOPMENT_TEAM if
    # you build under a different team. Simulator builds don't need a provisioning profile.
    DEVELOPMENT_TEAM: Q6JSHJ4DQN
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development

targets:
  Oculus-iOS:
    type: application
    platform: iOS
    sources:
      - Oculus/Sources
      - Oculus/Assets.xcassets
    info:
      path: Oculus/Info-iOS.plist
      properties:
        CFBundleDisplayName: Iron Rain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        # Uses only standard encryption (TLS + NaCl/curve25519) → exempt. Declaring this
        # lets TestFlight skip the per-build "Missing Compliance" prompt. Verify for your
        # jurisdiction if you add non-standard cryptography.
        ITSAppUsesNonExemptEncryption: false
        # Universal (iPhone+iPad) apps must declare orientations; iPad requires all four.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Allow cleartext ws:// to the daemon on the local network (direct/LAN mode).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Iron Rain connects to the daemon on your Mac over your local network."
        NSCameraUsageDescription: "Scan the daemon's QR code to pair."
        NSMicrophoneUsageDescription: "Dictate prompts to your agent by voice."
        NSSpeechRecognitionUsageDescription: "Transcribe your voice into prompts."
        NSPhotoLibraryUsageDescription: "Attach images to your prompts."
        NSUserActivityTypes:
          - com.howlerops.oculus.session
    dependencies:
      - package: OculusKit
        product: OculusUI
      - target: OculusWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Oculus/Oculus.entitlements

  OculusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - OculusWidgets
    dependencies:
      - package: OculusKit
        product: OculusUI
    info:
      path: OculusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Iron Rain
        # Must match the parent app's version, or App Store validation rejects the build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus.OculusWidgets

  Oculus-macOS:
    type: application
    platform: macOS
    sources:
      - Oculus/Sources
      - Oculus/Assets.xcassets
    info:
      path: Oculus/Info-macOS.plist
      properties:
        CFBundleName: Iron Rain          # macOS menu-bar/app title (defaults to the target name otherwise)
        CFBundleDisplayName: Iron Rain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: "Dictate prompts to your agent by voice."
        NSSpeechRecognitionUsageDescription: "Transcribe your voice into prompts."
        NSUserActivityTypes:
          - com.howlerops.oculus.session
    dependencies:
      - package: OculusKit
        product: OculusUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.howlerops.oculus

# Shared schemes (written to xcshareddata) so xcodebuild / gym / CI can find them.
schemes:
  Oculus-iOS:
    build:
      targets:
        Oculus-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
  Oculus-macOS:
    build:
      targets:
        Oculus-macOS: all
    run:
      config: Debug
    archive:
      config: Release
