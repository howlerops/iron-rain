# Iron Rain relay — a stateless ciphertext forwarder that bridges the app to a daemon from anywhere.
# Deploy:  cd daemon && fly deploy --config fly.relay.toml --dockerfile Dockerfile.relay
app = "oculus-relay-howlerops"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.relay"

[http_service]
  internal_port = 8080
  force_https = true
  # The relay holds long-lived host/client WebSocket connections, so it must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Each online daemon holds one persistent host WebSocket, so concurrency is dominated by idle
  # connections, not requests. Raise the fly-proxy limits well above the 25/250 default so the
  # relay doesn't refuse connections long before it runs out of memory.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 4000
    hard_limit = 5000

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
